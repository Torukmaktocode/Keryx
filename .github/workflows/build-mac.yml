name: build-mac

on:
  workflow_dispatch:
    inputs:
      incluir_biblioteca:
        description: 'Incluir biblioteca (726 modulos e-Sword) dentro del DMG'
        type: boolean
        default: true
      incluir_coalicion:
        description: 'Incluir corpus Coalicion (7947 articulos) dentro del DMG'
        type: boolean
        default: true
      etiqueta_release:
        description: 'Tag del release de salida'
        type: string
        default: 'mac-dmg'

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Descargar biblioteca del release datos
        if: ${{ inputs.incluir_biblioteca }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p apps/desktop/resources/biblioteca
          gh release download datos -p 'biblioteca.tar.gz.*' -O biblioteca.tar.gz
          cat biblioteca.tar.gz.* | tar -xzf -
          mv biblioteca/* apps/desktop/resources/biblioteca/
          rm -rf biblioteca biblioteca.tar.gz.*

      - name: Descargar corpus Coalicion del release datos
        if: ${{ inputs.incluir_coalicion }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p apps/desktop/resources/coalicion
          gh release download datos -p 'coalicion.tar.gz.*' -O coalicion.tar.gz
          cat coalicion.tar.gz.* | tar -xzf -
          mv articulos.jsonl apps/desktop/resources/coalicion/
          rm coalicion.tar.gz.*

      - name: Compilar renderer/main/preload
        run: npm run build --workspace @keryx/desktop

      - name: Empaquetar DMG (arm64 + x64, sin firmar)
        working-directory: apps/desktop
        run: |
          EXTRA=''
          if [ -d resources ]; then
            EXTRA='-c.extraResources=[{"from":"resources","to":"."}]'
          fi
          npx electron-builder --mac --arm64 --x64 -c.mac.identity=null -c.mac.target=dmg $EXTRA

      - name: Publicar en release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.etiqueta_release }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title 'Keryx para macOS' --notes 'DMG sin firmar: clic derecho > Abrir la primera vez (Gatekeeper).'
          gh release upload "$TAG" apps/desktop/dist/*.dmg --clobber
