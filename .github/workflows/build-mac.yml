name: build-mac

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tests del motor
        run: npm test

      - name: Generar DMG (arm64 + x64, solo la aplicacion)
        run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Publicar DMG en Release mac-dmg
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-dmg
          name: Keryx para macOS
          files: apps/desktop/dist/*.dmg
          overwrite_files: true
          allow_updates: true
