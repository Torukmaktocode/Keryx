name: build-mac

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Descargar biblioteca del release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L --fail -H "Authorization: Bearer $GH_TOKEN" \
            -o biblioteca.7z.001 \
            "${{ github.server_url }}/${{ github.repository }}/releases/download/biblioteca-v1/biblioteca.7z.001"
          python3 -m pip install --quiet --break-system-packages py7zr
          python3 -c "
          import py7zr
          with py7zr.SevenZipFile('biblioteca.7z.001') as z:
              z.extractall('.')
          "
          ls biblioteca | head -4

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar motor
        run: npm run eval

      - name: Generar DMG (con biblioteca integrada)
        run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Publicar artefacto DMG
        uses: actions/upload-artifact@v4
        with:
          name: Keryx-mac-dmg
          path: apps/desktop/dist/*.dmg
          retention-days: 14
          compression-level: 0
