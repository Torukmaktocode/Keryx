appId: org.keryx.app
productName: Keryx
directories:
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
compression: maximum
electronLanguages: [es, en-US, pt-BR, pt-PT]
removePackageScripts: true
nsis:
  differentialPackage: false
win:
  target:
    - nsis
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.reference
  identity: null
  extraResources:
    - from: ../../biblioteca
      to: biblioteca
      filter:
        - '**/*'
        - '!**/desktop.ini'
        - '!**/Thumbs.db'
        - '!**/.*'
linux:
  target:
    - AppImage
    - deb
  category: Education
