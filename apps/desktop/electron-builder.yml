appId: org.keryx.app
productName: Keryx
directories:
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
compression: maximum
electronLanguages: [es, en, pt]
removePackageScripts: true
nsis:
  differentialPackage: false
win:
  target:
    - nsis
mac:
  target:
    - dmg
  category: public.app-category.reference
  extraResources:
    - from: ../../biblioteca
      to: biblioteca
      filter:
        - '**/*'
linux:
  target:
    - AppImage
    - deb
  category: Education
